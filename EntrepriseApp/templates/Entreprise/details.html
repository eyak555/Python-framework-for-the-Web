<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails de l'entreprise</title>
</head>
<body>
    <main>
        <h1>{{ entreprise.raison_sociale }}</h1>
        <p><strong>Matricule fiscal :</strong> {{ entreprise.matricule_fiscale }}</p>
        <p><strong>Adresse :</strong> {{ entreprise.adresse }}</p>
        <p><strong>Type :</strong> {{ entreprise.get_type_entreprise_display }}</p>
        <p><strong>Gérant :</strong> {{ entreprise.gerant }}</p>
        <a href="{% url 'entreprise-update' entreprise.pk %}">Modifier</a>
        <a href="{% url 'entreprise-list' %}">Retour à la liste</a>
    </main>
</body>
</html>
