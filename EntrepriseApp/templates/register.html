{% extends "base.html" %}

{% block title %}Inscription | TransConnect{% endblock %}

{% block content %}
<section class="page-card auth-card">
    <p class="eyebrow">Rejoignez le réseau</p>
    <h1>Créer un compte</h1>
    <p class="page-intro">Renseignez vos informations pour créer votre espace TransConnect.</p>

    <form class="app-form" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="button-row">
            <button class="button" type="submit">Créer mon compte</button>
            <a class="button-secondary" href="{% url 'login' %}">J’ai déjà un compte</a>
        </div>
    </form>
</section>
{% endblock %}
