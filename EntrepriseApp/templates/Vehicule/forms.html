<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if object %}Modifier{% else %}Créer{% endif %} un véhicule</title>
    <style>
        body {
            margin: 0;
            padding: 48px 20px;
            background: linear-gradient(135deg, #eef2ff, #fdf2f8);
            color: #172033;
            font-family: Arial, sans-serif;
        }

        .form-card {
            width: min(720px, 100%);
            margin: 0 auto;
            padding: 36px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            box-shadow: 0 18px 45px rgba(30, 41, 59, .12);
        }

        h1 {
            margin: 0 0 8px;
            color: #111827;
        }

        .intro {
            margin: 0 0 28px;
            color: #64748b;
        }

        form p {
            margin: 0 0 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-size: 14px;
            font-weight: 700;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background: #f8fafc;
            font: inherit;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, .14);
        }

        .errorlist {
            margin: 6px 0;
            padding: 0;
            color: #b91c1c;
            list-style: none;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        button, .cancel-link {
            padding: 12px 20px;
            border-radius: 9px;
            font: inherit;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            border: 0;
            background: #7c3aed;
            color: #fff;
        }

        .cancel-link {
            border: 1px solid #cbd5e1;
            color: #475569;
        }

        @media (max-width: 560px) {
            body {
                padding: 24px 12px;
            }

            .form-card {
                padding: 24px 18px;
            }

            .actions {
                flex-direction: column;
            }

            button, .cancel-link {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <main class="form-card">
        <h1>{% if object %}Modifier le véhicule{% else %}Créer un véhicule{% endif %}</h1>
        <p class="intro">
            {% if object %}Mettez à jour les informations du véhicule.{% else %}Renseignez les informations du nouveau véhicule.{% endif %}
        </p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="actions">
                <button type="submit">{% if object %}Enregistrer les modifications{% else %}Créer le véhicule{% endif %}</button>
                <a class="cancel-link" href="{% url 'vehicule-list' %}">Annuler</a>
            </div>
        </form>
    </main>
</body>
</html>
