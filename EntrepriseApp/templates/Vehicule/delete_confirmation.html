{% extends "base.html" %}

{% block title %}Supprimer un véhicule | TransConnect{% endblock %}

{% block content %}
<section class="page-card page-card--narrow">
    <p class="eyebrow">Action irréversible</p>
    <h1>Supprimer ce véhicule ?</h1>
    <p class="page-intro">Confirmez-vous la suppression du véhicule <strong>{{ object.immatriculation }}</strong> ?</p>
    <form class="button-row" method="post">
        {% csrf_token %}
        <button class="button-danger" type="submit">Oui, supprimer</button>
        <a class="button-secondary" href="{% url 'vehicule-list' %}">Annuler</a>
    </form>
</section>
{% endblock %}
