{% extends "base.html" %}

{% block title %}Supprimer une expédition | TransConnect{% endblock %}

{% block content %}
<section class="page-card page-card--narrow">
    <p class="eyebrow">Action irréversible</p>
    <h1>Supprimer cette expédition ?</h1>
    <p class="page-intro">
        Confirmez-vous la suppression de l’expédition
        <strong>{{ expedition.reference }}</strong> ?
    </p>
    <form class="button-row" method="post">
        {% csrf_token %}
        <button class="button-danger" type="submit">Oui, supprimer</button>
        <a class="button-secondary" href="{% url 'listclass' %}">Annuler</a>
    </form>
</section>
{% endblock %}
