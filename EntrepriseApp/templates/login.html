{% extends "base.html" %}

{% block title %}Connexion | TransConnect{% endblock %}

{% block content %}
<section class="page-card auth-card">
    <p class="eyebrow">Bon retour</p>
    <h1>Connexion</h1>
    <p class="page-intro">Connectez-vous pour accéder à votre espace TransConnect.</p>

    <form class="app-form" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="button-row">
            <button class="button" type="submit">Se connecter</button>
            <a class="button-secondary" href="{% url 'register' %}">Créer un compte</a>
        </div>
    </form>
</section>
{% endblock %}
